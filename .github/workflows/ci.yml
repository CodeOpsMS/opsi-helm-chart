name: Helm CI

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  static:
    name: Static / Helm ${{ matrix.line }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - line: '3'
            version: v3.21.3
          - line: '4'
            version: v4.2.3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: ${{ matrix.version }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - name: Install pinned chart validation tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y zsh
          python3 -m pip install cryptography==50.0.1
          curl -fsSL --retry 3 https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz -o /tmp/kubeconform.tgz
          echo '9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  /tmp/kubeconform.tgz' | sha256sum -c -
          tar -xzf /tmp/kubeconform.tgz -C /tmp kubeconform
      - name: Lint, unit tests and Kubernetes 1.34 schemas
        run: |
          set -euo pipefail
          helm lint charts/opsi --strict -f tests/ci-values.yaml
          python3 -m unittest discover -s charts/opsi/tests/unit -v
          helm template opsi charts/opsi --namespace opsi-ci -f tests/ci-values.yaml > /tmp/opsi.yaml
          /tmp/kubeconform -strict -summary -kubernetes-version 1.34.0 /tmp/opsi.yaml
          helm template opsi charts/opsi --namespace opsi-ci -f tests/ci-values.yaml --set pxe.enabled=true --set pxe.hostNetwork=true > /tmp/opsi-pxe.yaml
          /tmp/kubeconform -strict -summary -kubernetes-version 1.34.0 /tmp/opsi-pxe.yaml
          python3 -m unittest discover -s tests -p 'test_*.py'
          shellcheck scripts/*.sh

  candidate:
    name: Build candidate
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.2.3
      - name: Package once
        run: |
          set -euo pipefail
          mkdir .candidate
          helm package charts/opsi --destination .candidate
          python3 scripts/candidate.py create .candidate
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: opsi-chart-${{ github.run_id }}-${{ github.run_attempt }}
          path: .candidate/*
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error

  runtime:
    name: Runtime / Kubernetes 1.34
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.2.3
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: opsi-chart-${{ github.run_id }}-${{ github.run_attempt }}
          path: .candidate
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: opsi-ci
          version: v0.32.0
          node_image: kindest/node:v1.34.8@sha256:02722c2dedddcfc00febf5d27fbeb9b7b2c14294c82109ff4a85d89ac9ba3256
      - name: Install and exercise the immutable candidate
        run: scripts/kind-acceptance.sh .candidate
      - name: Non-sensitive diagnostics
        if: failure()
        run: |
          kubectl --context kind-opsi-ci -n opsi-ci get pods,deployments,pvc,services
          kubectl --context kind-opsi-ci -n opsi-ci get events --sort-by=.lastTimestamp
