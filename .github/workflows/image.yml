name: OPSI image

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - scripts/build-image.sh
      - scripts/check-image.sh
      - scripts/publish-image.sh
      - .github/workflows/image.yml
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: opsi-image-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and verify without publishing
        env:
          IMAGE: ghcr.io/codeopsms/opsi-server:sha-${{ github.sha }}
        run: scripts/build-image.sh "$IMAGE" "$GITHUB_SHA"

  publish:
    name: Build, verify and publish main image
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/codeopsms/opsi-server:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and verify once
        run: scripts/build-image.sh "$IMAGE" "$GITHUB_SHA"
      - name: Publish the verified image
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-image.sh "$IMAGE"
      - name: Attest the published manifest
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/codeopsms/opsi-server
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
