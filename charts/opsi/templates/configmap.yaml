{{- include "opsi.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opsi.fullname" . }}-runtime
  labels:
    {{- include "opsi.labels" . | nindent 4 }}
data:
  config.json: |
    {{- dict "server" .Values.server "bootstrap" .Values.bootstrap "pxe" (dict "enabled" .Values.pxe.enabled) "image" (include "opsi.image" .) | toJson | nindent 4 }}
  {{- range $path, $_ := .Files.Glob "files/*" }}
  {{ base $path }}: |
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
{{- if .Values.tls.additionalCAs }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opsi.fullname" . }}-additional-ca
  labels:
    {{- include "opsi.labels" . | nindent 4 }}
data:
  {{- range $index, $pem := .Values.tls.additionalCAs }}
  ca-{{ $index }}.crt: |
    {{- $pem | nindent 4 }}
  {{- end }}
{{- end }}
